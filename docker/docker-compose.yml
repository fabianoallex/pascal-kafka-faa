# One Apache Kafka 4.4.0 broker in KRaft mode (broker and controller in one
# process), for the integration tests and the codec captures.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Listeners, all advertised as localhost so that the same addresses work from
# the Windows host (published ports) and from a Linux test container started
# with --network container:pascal-kafka-faa-broker (tools/test_fpc_docker.sh):
#
#   9092  PLAINTEXT
#   9093  TLS: TLS without client authentication. The server certificate and
#         key are the pascal-common-faa test PKI (external/pascal-common-faa/
#         tests/pki: srv_cert.pem, CN=localhost, SAN localhost and 127.0.0.1,
#         signed by ca_cert.pem). Public test keys: no security value.
#   9094  the KRaft controller (not published)
#   9096  SASL: SASL_PLAINTEXT, mechanisms PLAIN and SCRAM-SHA-256
#   9097  SASLTLS: SASL_SSL, the same mechanisms over the TLS of 9093
#   9098  REAUTH: SASL_PLAINTEXT with connections.max.reauth.ms = 2000, for
#         the KIP-368 test (a session that ends while the test runs)
#
# Users (test credentials): PLAIN alice / alice-secret, from the JAAS lines
# below; SCRAM-SHA-256 bob / bob-secret, created when the storage is
# formatted (kafka-start.sh, which says why it formats before the image does).
#
# The TLS listeners are named TLS and SASLTLS, not SSL or SASL_SSL: the image's
# configure script asks for the JKS-style KAFKA_SSL_KEYSTORE_FILENAME/...
# variables as soon as an advertised listener contains "SSL://". Kafka reads a
# PEM keystore (KIP-651) as one file with the key and the chain
# (kafka-start.sh concatenates the two PEM files of the PKI).
#
# Configuration names map to variables as the image does it: KAFKA_ prefix,
# "." as "_", "-" as "___" (listener.name.sasl.scram-sha-256.sasl.jaas.config
# is KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___256_SASL_JAAS_CONFIG).
#
# Topics are auto-created on first metadata request (the default), so a test
# can ask for a topic it never created. One is created at start
# (kafka-start.sh): pascal-kafka-faa-it-zstd, compression.type=zstd.
name: pascal-kafka-faa

services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: pascal-kafka-faa-broker
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9096:9096"
      - "9097:9097"
      - "9098:9098"
    volumes:
      - ../external/pascal-common-faa/tests/pki:/pki:ro
      - ./kafka-start.sh:/kafka-start.sh:ro
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka-start.sh formats this directory: without the variable, the broker
      # would use Kafka's default (/tmp/kafka-logs), not the image's.
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_LISTENERS: PLAINTEXT://:9092,TLS://:9093,CONTROLLER://:9094,SASL://:9096,SASLTLS://:9097,REAUTH://:9098
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,TLS://localhost:9093,SASL://localhost:9096,SASLTLS://localhost:9097,REAUTH://localhost:9098
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,TLS:SSL,CONTROLLER:PLAINTEXT,SASL:SASL_PLAINTEXT,SASLTLS:SASL_SSL,REAUTH:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_NAME_TLS_SSL_KEYSTORE_TYPE: PEM
      KAFKA_LISTENER_NAME_TLS_SSL_KEYSTORE_LOCATION: /tmp/tls/server.pem
      KAFKA_LISTENER_NAME_TLS_SSL_CLIENT_AUTH: none
      KAFKA_LISTENER_NAME_SASLTLS_SSL_KEYSTORE_TYPE: PEM
      KAFKA_LISTENER_NAME_SASLTLS_SSL_KEYSTORE_LOCATION: /tmp/tls/server.pem
      KAFKA_LISTENER_NAME_SASLTLS_SSL_CLIENT_AUTH: none
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256
      KAFKA_LISTENER_NAME_SASL_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required user_alice="alice-secret";'
      KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_SASLTLS_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required user_alice="alice-secret";'
      KAFKA_LISTENER_NAME_SASLTLS_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_REAUTH_PLAIN_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required user_alice="alice-secret";'
      KAFKA_LISTENER_NAME_REAUTH_SCRAM___SHA___256_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.scram.ScramLoginModule required;'
      KAFKA_LISTENER_NAME_REAUTH_PLAIN_CONNECTIONS_MAX_REAUTH_MS: 2000
      KAFKA_LISTENER_NAME_REAUTH_SCRAM___SHA___256_CONNECTIONS_MAX_REAUTH_MS: 2000
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    command: ["sh", "/kafka-start.sh"]
    healthcheck:
      # Up, and the zstd topic kafka-start.sh creates is there.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic pascal-kafka-faa-it-zstd > /dev/null 2>&1"]
      interval: 5s
      timeout: 20s
      retries: 30
